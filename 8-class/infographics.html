<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инфографика | Цифрлі тарих</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #FDFBF7; /* Светлый приятный фон */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 40px;
            min-height: 100vh;
        }

        /* Кнопка "Назад" */
        .back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            z-index: 100;
            border: 1px solid #e0e0e0;
        }

        .back-btn:hover {
            background-color: #3498db;
            color: white;
            transform: translateX(-5px);
        }

        /* Контейнер для картинки, чтобы она красиво смотрелась */
        .image-container {
            max-width: 1200px; /* Ограничиваем ширину, чтобы на огромных экранах не растягивалось */
            width: 100%;
            background: transparent;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden; /* Закругляет углы у самой картинки */
            animation: fadeIn 0.5s ease-in-out;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Адаптация для телефонов */
        @media (max-width: 768px) {
            .back-btn { top: 15px; left: 15px; padding: 8px 15px; font-size: 0.9rem; }
            body { padding-top: 70px; }
        }
    </style>
</head>
<body>

    <!-- Кнопка возврата на главную страницу класса -->
    <a href="index.html" class="back-btn">← Артқа</a>

    <!-- Блок с самой инфографикой -->
    <div class="image-container">
        <!-- Укажите правильный путь к картинке -->
        <img src="images/infographic.png" alt="Түркілер туралы тарихи деректер">
    </div>

</body>
</html>
